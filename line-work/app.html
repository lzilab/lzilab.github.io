<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LZI 線稿機 1.0 試用版</title>
<meta name="robots" content="noindex"><link rel="icon" href="/img/favicon.png">
<style>
:root{
  --ink:#111111; --paper:#F2EFE6; --card:#FFFFFF; --signal:#F0B429; --gray:#8B8F98; --line:#DDD8CC;
  --serif:"Songti TC","Noto Serif TC","Source Han Serif TC","PMingLiU",serif;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --latin:"Avenir Next","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:14px/1.5 var(--sans)}
header{height:60px;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--paper)}
.logo{font:800 20px/1 var(--latin);letter-spacing:.02em}
.logo b{display:inline-block;background:var(--ink);color:var(--paper);padding:4px 6px;margin-right:6px}
.pname{font:700 18px/1 var(--serif)}
.tag{color:var(--gray);font-size:13px}
.trial{background:var(--signal);color:var(--ink);font-size:12px;font-weight:700;padding:3px 8px;border-radius:4px}
header .spacer{flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--ink);background:var(--card);color:var(--ink);border-radius:6px;padding:8px 12px}
button:hover{background:#faf8f2}
button.primary{background:var(--ink);color:var(--paper)}
button.primary:hover{background:#2a2a2a}
button:disabled{opacity:.35;cursor:not-allowed}
.app{display:flex;height:calc(100% - 60px)}
main{flex:1;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;padding:28px}
#view{max-width:100%;max-height:100%;box-shadow:0 12px 40px rgba(0,0,0,.18);
  background:repeating-conic-gradient(#e6e2d8 0 25%,#fff 0 50%) 0 0/18px 18px;display:none}
#view.pan{cursor:grab}
#view.dragging{cursor:grabbing}
#empty{text-align:center;border:2px dashed #c9c3b5;border-radius:16px;padding:56px 48px;background:rgba(255,255,255,.5)}
#empty h2{font:700 28px/1.3 var(--serif);margin:0 0 8px}
#empty p{color:var(--gray);margin:0 0 22px}
#empty .btns{display:flex;gap:10px;justify-content:center}
main.over #empty,main.over #view{outline:3px solid var(--signal);outline-offset:6px}
#stats{position:absolute;bottom:8px;right:14px;color:var(--gray);font-size:12px}
#toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:6px;font-size:13px;display:none;z-index:5}
aside{width:380px;flex:none;overflow:auto;border-left:1px solid var(--line);background:var(--card);padding:6px 20px 30px}
aside.off section,aside.off details{opacity:.35;pointer-events:none}
section{padding:16px 0;border-bottom:1px solid var(--line)}
h3{font:700 16px/1.2 var(--serif);margin:0 0 12px;display:flex;align-items:center;gap:8px}
h3 .n{font:800 12px/1 var(--latin);background:var(--signal);border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.style{border:2px solid transparent;border-radius:8px;padding:4px;background:none;text-align:center;font-size:12px}
.style canvas{width:100%;display:block;border-radius:4px;background:#eee}
.style.on{border-color:var(--signal);background:#fff8e6}
.style span{display:block;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:999px;padding:6px 12px;font-size:13px;border-color:#cfc9bb}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.note{color:var(--gray);font-size:12px;margin:8px 0 0}
.row{display:grid;grid-template-columns:70px 1fr 44px;align-items:center;gap:8px;margin:6px 0}
.row output{text-align:right;color:var(--gray);font-variant-numeric:tabular-nums;font-size:12px}
.field{display:block;margin:8px 0}
.field span{display:block;font-size:12px;color:var(--gray);margin-bottom:4px}
input[type=range]{width:100%;accent-color:var(--ink)}
input[type=text],textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid #cfc9bb;border-radius:6px;background:#fff}
textarea{min-height:76px;resize:vertical;font-size:16px}
#posterFields input{margin-top:6px}
.exports{display:grid;gap:8px}
.exports button{padding:11px;font-weight:600;text-align:left;display:flex;justify-content:space-between}
.exports small{color:inherit;opacity:.6;font-weight:400}
details{padding:14px 0}
summary{cursor:pointer;font:700 15px var(--serif)}
.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
input[type=color]{width:100%;height:30px;border:1px solid #cfc9bb;border-radius:6px;padding:2px;background:#fff}
select{width:100%;font:inherit;padding:6px;border-radius:6px;border:1px solid #cfc9bb;background:#fff}
label.chk{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:13px}
.hide{display:none!important}
@media (max-width:900px){
  .app{flex-direction:column;height:auto}
  main{height:60vh;padding:16px}
  aside{width:100%;border-left:0;border-top:1px solid var(--line)}
  header .tag{display:none}
}

</style>

<header>
  <div class="logo"><b>LZI</b>LAB</div>

  <div class="tag" id="ptag"></div>

    <canvas id="view"></canvas>
    <div id="toast"></div>
    <div id="stats"></div>
    <input type="file" id="file" accept="image/*,video/*" hidden>

  <aside id="panel" class="off">
    <section id="mainSec" class="hide">
      <h3><span class="n"></span><span id="mainTitle"></span></h3>
      <div id="mainCtl"></div>

    <section>
      <h3><span class="n"></span>選一個風格</h3>
      <div class="styles" id="styles"></div>

    <section>
      <h3><span class="n"></span>用在哪裡</h3>

  </aside>
</div>
